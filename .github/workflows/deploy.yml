name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    env:
      TESTING: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Setup Python Virtual Environment
        run: python -m venv .venv

      - name: Install Dependencies
        run: .venv/bin/pip install -r requirements.txt

      - name: Run Tests
        run: ./run_test.sh

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Configure SSH
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_IP: ${{ secrets.SSH_IP }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy-key.pem
          chmod 600 ~/.ssh/deploy-key.pem
          cat >> ~/.ssh/config <<END
          Host my-vps
            HostName $SSH_IP
            User $SSH_USER
            IdentityFile ~/.ssh/deploy-key.pem
            BatchMode yes
            ConnectTimeout 15
            ServerAliveInterval 10
            ServerAliveCountMax 3
            StrictHostKeyChecking no
          END

      - name: Print project root directory
        run: timeout 45s ssh my-vps 'cd "${{ secrets.PROJECT_ROOT }}" && pwd'

      - name: Deploy site
        run: timeout 10m ssh my-vps 'cd "${{ secrets.PROJECT_ROOT }}" && ./redeploy-site.sh'

      - name: Print container status
        run: timeout 60s ssh my-vps 'cd "${{ secrets.PROJECT_ROOT }}" && docker compose -f docker-compose.prod.yml ps'

  notify-success:
    name: Send Discord success notification
    runs-on: ubuntu-latest
    needs:
      - test
      - deploy
    if: ${{ needs.deploy.result == 'success' }}
    steps:
      - name: Send Discord success notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl -s -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"content\":\"Deployment Successful: ${GITHUB_REPOSITORY}@${GITHUB_SHA}\"}"

  notify-failure:
    name: Send Discord failure notification
    runs-on: ubuntu-latest
    needs:
      - test
      - deploy
    if: ${{ always() && (needs.test.result == 'failure' || needs.deploy.result == 'failure') }}
    steps:
      - name: Send Discord failure notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl -s -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"content\":\"Deployment Failed: ${GITHUB_REPOSITORY}@${GITHUB_SHA}\"}"
